<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post Maker | DVT Command</title>
<meta name="robots" content="noindex">
<style>
:root{--gold:#e7c476;--gold2:#f5dfa3;--text:#f5f1ff;--muted:#c4bfd4;--line:rgba(226,195,119,.24);--glass:rgba(18,14,38,.8);--ok:#7fd9a8;--warn:#f2c14e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(ellipse at 85% 0%,rgba(180,130,47,.22),transparent 34rem),#070610}
button,input,select{font:inherit}:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:8px 16px;border-bottom:1px solid var(--line);background:rgba(7,6,16,.86);backdrop-filter:blur(16px)}
header a{color:inherit;font-weight:700;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.brand{font-size:.78rem;font-weight:800;letter-spacing:.16em;color:var(--gold)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 96px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.9rem,6vw,3.2rem);line-height:1.08;margin:18px 0 8px}h1 em{color:var(--gold)}
.note{display:flex;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);font-size:.95rem}
.grid{display:grid;grid-template-columns:1fr 1.05fr;gap:16px;margin-top:16px;align-items:start}
.card{padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--glass)}
label{display:grid;gap:6px;margin:0 0 12px;flex:1 1 0;min-width:0}label>span{font-size:.86rem;font-weight:700;color:var(--muted)}
input,select{width:100%;min-height:50px;padding:10px 14px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(5,4,12,.7);color:var(--text);font-size:1.02rem}
.row{display:flex;gap:12px}.short{flex:0 0 96px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font-weight:800;cursor:pointer;text-decoration:none}
.gold{color:#1d1206;border-color:#f3dc9a;background:linear-gradient(180deg,#f3dc9a,var(--gold) 55%,#b98a3a)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
#preview{display:block;width:100%;height:auto;border-radius:16px;background:#000}
ul{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px;font-size:.94rem}li.fix::before{content:"⚠ ";color:var(--warn)}li.tip{color:var(--muted)}li.tip::before{content:"✦ ";color:var(--gold)}
.ok{color:var(--ok);font-weight:700;margin-top:12px}
ol{padding-left:22px;display:grid;gap:8px}ol span{display:block;color:var(--muted);font-size:.93rem}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:12px 18px;border-radius:999px;background:#1d1630;border:1px solid var(--gold);font-weight:700;display:none}
@media(max-width:860px){.grid{grid-template-columns:1fr}.preview{order:-1}}
@media(max-width:420px){.row{flex-wrap:wrap}.short{flex:1 1 100%}.btn{width:100%}}
</style>
</head>
<body>
<header><a href="./">← Back</a><span class="brand">POST MAKER</span><span style="font-size:.8rem;color:var(--muted)">Saved on this phone</span></header>
<main>
<h1>Make a local post <em>in one minute.</em></h1>
<p class="note"><span>✓</span><span><b>Works now:</b> build, preview, download the picture and copy a caption. <b>Not connected:</b> posting to Facebook or Instagram. Post the picture from your own apps.</span></p>
<div class="grid">
<section class="card">
<label><span>Business name</span><input id="business"></label>
<div class="row"><label><span>City</span><input id="city"></label><label class="short"><span>State</span><input id="region" maxlength="3"></label></div>
<label><span>Kind of business</span><select id="niche"></select></label>
<label><span>First beat (small)</span><input id="setup"></label>
<label><span>Second beat (big, gold)</span><input id="payoff"></label>
<button class="btn" id="next" type="button">⇄ Next headline</button>
<label style="margin-top:12px"><span>Service line</span><input id="serviceLine" list="svc"><datalist id="svc"></datalist></label>
<label><span>Button</span><input id="cta" list="ctas"><datalist id="ctas"></datalist></label>
<div class="row"><label><span>Size</span><select id="format"></select></label><label><span>Colors</span><select id="palette"></select></label></div>
<div class="actions"><label class="btn" style="display:inline-flex;margin:0">＋ Add your photo<input id="photo" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><button class="btn" id="nophoto" type="button" hidden>✕ Remove photo</button></div>
<p id="tip" style="color:var(--muted);font-size:.92rem"></p>
</section>
<section class="card preview">
<img id="preview" alt="Post preview">
<div class="actions"><button class="btn gold" id="dl" type="button">⬇ Download picture</button><button class="btn" id="cap" type="button">Copy caption</button></div>
<ul id="checks"></ul>
</section>
</div>
<section class="card" style="margin-top:16px"><h2 style="font-family:Georgia,serif;margin:0 0 8px">Why this post works</h2><ol id="formula"></ol></section>
</main>
<div id="toast" role="status"></div>

    const tagNiche = NICHES[spec.niche].label.replace(/[^A-Za-z0-9]/g, "");
    return [
        `${spec.setup.trim()} ${spec.payoff.trim()}`,
        `${spec.serviceLine.trim()}${place ? ` in ${place}` : ""}.`,
        `${spec.cta.trim()}: message ${spec.business.trim() || "us"} today.`,
        [tagCity && `#${tagCity}`, tagNiche && `#${tagNiche}`, tagCity && `#${tagCity}SmallBusiness`].filter(Boolean).join(" "),
    ].join("\n\n");
}
/**
 * Email draft for the free-post play. The person sends it from their own email app and attaches
 * the downloaded image; Tay does not send anything. US commercial email needs a real postal
 * address and a way to opt out, so both are part of the draft.
 */
function outreachEmail(input) {
    const prospect = input.prospect.trim() || "your business";
    const missing = [
        !input.prospect.trim() && "their business name",
        !input.senderName.trim() && "your name",
        !input.senderBusiness.trim() && "your business name",
        !input.senderAddress.trim() && "your mailing address (US law requires one on business email)",
    ].filter(Boolean);
    const hello = input.contactName.trim() ? `Hi ${input.contactName.trim()},` : "Hi there,";
    const body = [
        hello,
        `I'm ${input.senderName.trim() || "[your name]"} with ${input.senderBusiness.trim() || "[your business]"}. I made this social post for ${prospect}. It's attached, and it's yours to use for free, no strings.`,
        "If you like it, I can make a few more each month so your page stays active while you're out doing the work. Want me to send two more ideas?",
        "Either way, the post is yours.",
        `${input.senderName.trim() || "[your name]"}\n${input.senderBusiness.trim() || "[your business]"}\n${input.senderAddress.trim() || "[your mailing address]"}`,
        "Not interested? Reply \"no thanks\" and I won't follow up.",
    ].join("\n\n");
    return { subject: `A free social post I made for ${prospect}`, body, missing };
}
function mailtoLink(to, draft) {
    const addr = /^[^\s@<>"]+@[^\s@<>"]+\.[^\s@<>"]+$/.test(to.trim()) ? to.trim() : "";
    return `mailto:${encodeURIComponent(addr)}?subject=${encodeURIComponent(draft.subject)}&body=${encodeURIComponent(draft.body)}`;
}
function fileName(spec) {
    const slug = `${spec.business}-${spec.city}-${spec.format}`.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    return `${slug || "free-post"}.png`;
}
function emptyFreePost() {
    return { mode: "mine", spec: presetSpec("hallway-cleaning"), outreach: { prospect: "", contactName: "", senderName: "", senderBusiness: "", senderAddress: "", to: "" }, headlineIndex: 0 };
}
const str = (v, max = 200) => (typeof v === "string" ? v.slice(0, max) : "");
/** Validates saved state. The photo is never saved, so it can't fill device storage. */
function parseFreePost(raw) {
    const base = emptyFreePost();
    if (!raw || typeof raw !== "object")
        return base;
    const r = raw;
    const s = (r.spec && typeof r.spec === "object" ? r.spec : {});
    const o = (r.outreach && typeof r.outreach === "object" ? r.outreach : {});
    const pick = (v, allowed, d) => (allowed.includes(v) ? v : d);
    return {
        mode: pick(r.mode, ["mine", "outreach"], "mine"),
        headlineIndex: Number.isInteger(r.headlineIndex) ? Math.max(0, Number(r.headlineIndex)) : 0,
        spec: {
            business: str(s.business, 80), city: str(s.city, 60), region: str(s.region, 30),
            niche: pick(s.niche, Object.keys(NICHES), base.spec.niche),
            setup: str(s.setup, 60) || base.spec.setup, payoff: str(s.payoff, 60) || base.spec.payoff,
            serviceLine: str(s.serviceLine, 120), cta: str(s.cta, 60) || base.spec.cta,
            format: pick(s.format, Object.keys(FORMATS), "square"),
            palette: pick(s.palette, Object.keys(PALETTES), "cream-gold"),
        },
        outreach: {
            prospect: str(o.prospect, 80), contactName: str(o.contactName, 60), senderName: str(o.senderName, 60),
            senderBusiness: str(o.senderBusiness, 80), senderAddress: str(o.senderAddress, 160), to: str(o.to, 120),
        },
    };
}

(function(){
  var KEY="post-maker-v1", DEFAULT_PRESET="dryer-vent-tech";
  var $=function(id){return document.getElementById(id)};
  var state; try{state=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){state=null}
  var spec=(state&&state.spec)?parseFreePost({spec:state.spec}).spec:presetSpec(DEFAULT_PRESET);
  var idx=0, photo="";
  function fill(sel,obj,lab){sel.innerHTML=Object.keys(obj).map(function(k){return '<option value="'+k+'">'+escapeXml(lab(obj[k]))+'</option>'}).join("")}
  fill($("niche"),NICHES,function(n){return n.label});fill($("format"),FORMATS,function(f){return f.label});fill($("palette"),PALETTES,function(p){return p.label});
  $("formula").innerHTML=POST_FORMULA.filter(function(p){return p.id!=="free-post-play"}).map(function(p){return "<li><b>"+escapeXml(p.name)+".</b> "+escapeXml(p.what)+" <span>"+escapeXml(p.why)+"</span></li>"}).join("");
  var fields=["business","city","region","niche","setup","payoff","serviceLine","cta","format","palette"];
  function toForm(){fields.forEach(function(f){$(f).value=spec[f]});var k=NICHES[spec.niche];$("svc").innerHTML=k.serviceLines.map(function(s){return '<option value="'+escapeXml(s)+'">'}).join("");$("ctas").innerHTML=k.ctas.map(function(s){return '<option value="'+escapeXml(s)+'">'}).join("")}
  function toast(t){var el=$("toast");el.textContent=t;el.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){el.style.display="none"},2600)}
  function current(){var s=Object.assign({},spec);if(photo)s.photo=photo;return s}
  function render(){
    try{localStorage.setItem(KEY,JSON.stringify({spec:spec}))}catch(e){}
    var s=current(),svg=renderPostSVG(s);
    $("preview").src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
    $("preview").alt="Post preview: "+s.setup+" "+s.payoff+" "+s.serviceLine+". "+s.cta+".";
    var c=checkPost(s);
    $("checks").innerHTML=c.length?c.map(function(x){return '<li class="'+x.level+'">'+escapeXml(x.text)+"</li>"}).join(""):"";
    if(!c.length)$("checks").innerHTML='<li class="ok">Ready to post.</li>';
    $("tip").textContent=NICHES[s.niche].photoTip+" Photos stay on this phone and aren't saved.";
    $("nophoto").hidden=!photo;
  }
  fields.forEach(function(f){$(f).addEventListener("input",function(e){
    if(f==="niche"){var k=NICHES[e.target.value];idx=0;spec.niche=e.target.value;spec.setup=k.headlines[0][0];spec.payoff=k.headlines[0][1];spec.cta=k.ctas[0];toForm()}
    else spec[f]=f==="region"?e.target.value.toUpperCase().slice(0,3):e.target.value;
    render();
  })});
  $("next").onclick=function(){var k=NICHES[spec.niche];idx=(idx+1)%k.headlines.length;spec.setup=k.headlines[idx][0];spec.payoff=k.headlines[idx][1];toForm();render()};
  $("photo").onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)){toast("Use a JPG, PNG or WebP photo.");return}if(f.size>6*1024*1024){toast("That photo is over 6 MB.");return}var r=new FileReader();r.onload=function(){photo=String(r.result);render()};r.readAsDataURL(f)};
  $("nophoto").onclick=function(){photo="";render()};
  $("cap").onclick=function(){var t=caption(current());(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast("Caption copied")},function(){prompt("Copy the caption:",t)})};
  $("dl").onclick=function(){
    var s=current(),f=FORMATS[s.format],url=URL.createObjectURL(new Blob([renderPostSVG(s)],{type:"image/svg+xml"})),img=new Image();
    img.onload=function(){var c=document.createElement("canvas");c.width=f.width;c.height=f.height;c.getContext("2d").drawImage(img,0,0,f.width,f.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){if(!b){toast("Couldn't make the picture here.");return}var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fileName(s);a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);toast("Picture saved")},"image/png")};
    img.onerror=function(){toast("Couldn't make the picture here.")};img.src=url;
  };
  toForm();render();
})();
</script>
